name: JPDC S3 full exploratory cohort exposure eight missing seeds
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-exposure-8missing-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [0,1,5,9,13,21,27,29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generated-only E45 instrumentation and real CloudSim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exposure
          git rev-parse HEAD > exposure/research_sha.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = "34256ca7bff46f911cf20e8b94278fbd09175746"
          python3 tools/e45_generate.py
          python3 jpdc/instrument_s3_network_exposure_generated_e45.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out exposure/results.csv" > exposure/run.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' exposure/run.log
          grep '^JPDC_SHOCK_MASK,' exposure/run.log > exposure/mask.csv
          grep '^JPDC_NETWORK_EXPOSURE,' exposure/run.log > exposure/mission_network.csv
          python3 - <<'PY'
          import csv,math,json
          seed=str(4202202600+${{ matrix.seed }})
          m=list(csv.reader(open('exposure/mask.csv')))
          e=list(csv.reader(open('exposure/mission_network.csv')))
          assert len(m)==21,(len(m),m[:2])
          affected=set()
          for r in m:
              assert len(r)==6 and r[0]=='JPDC_SHOCK_MASK' and r[1]==seed and r[2]=='S3_HIDDEN_NETWORK_50LOSS' and r[3]=='CASPER_FULL'
              assert int(r[4]) in range(21) and r[5] in ('true','false')
              if r[5]=='true':affected.add(int(r[4]))
          assert len(affected)==6,affected
          assert len(e)>1000
          ids=set()
          for r in e:
              assert len(r)==11 and r[0]=='JPDC_NETWORK_EXPOSURE' and r[1]==seed and r[2]=='S3_HIDDEN_NETWORK_50LOSS' and r[3]=='CASPER_FULL',r
              task,node=int(r[4]),int(r[5])
              assert task not in ids;ids.add(task)
              assert (r[6]=='true')==(node in affected)
              nominal,actual,mult,pred=map(float,r[7:11])
              assert all(map(math.isfinite,(nominal,actual,mult,pred))) and nominal>=0
              assert abs(actual-nominal*mult)<1e-5
              assert abs(mult-(2.0 if task>=10000 and node in affected else 1.0))<1e-8
          assert len(list(csv.DictReader(open('exposure/results.csv'))))==8
          print("JPDC_NETWORK_EXPOSURE_CONTRACT_PASS",seed,len(ids),sorted(affected))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpdc-s3-network-exposure-seed-${{ matrix.seed }}
          path: exposure/
          if-no-files-found: warn
