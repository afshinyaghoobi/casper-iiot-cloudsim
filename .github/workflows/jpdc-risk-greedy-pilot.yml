name: JPDC risk-penalized independent-task pilot
on:
  workflow_dispatch:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - 'jpdc/uncertainty_penalized_greedy_patch.py'
      - 'jpdc/verify_risk_greedy_pilot_parity.py'
      - '.github/workflows/jpdc-risk-greedy-pilot.yml'
permissions:
  contents: read
jobs:
  paired-seed0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate isolated experiment and compile
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          mkdir -p pilot
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 0 --cal 80000 --tasks 30000 --scenarios ALL --out pilot/before.csv" > pilot/before.log 2>&1
          python3 jpdc/uncertainty_penalized_greedy_patch.py
          mvn -B -ntp -DskipTests compile
      - name: Run five scenarios for seed 0
        run: |
          set -euo pipefail
          mkdir -p pilot
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 0 --cal 80000 --tasks 30000 --scenarios ALL --out pilot/results.csv" > pilot/run.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' pilot/run.log
          python3 - <<'PY'
          import csv
          with open('pilot/results.csv', newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==45, len(rows)
          for scenario in set(x['scenario'] for x in rows):
              group=[r for r in rows if r['scenario']==scenario]
              assert len(group)==9
              assert any('UNCERTAINTY_PENALIZED_GREEDY' in str(r) for r in group)
          print('RISK_GREEDY_PILOT_CSV_PASS',len(rows))
          PY
          python3 jpdc/verify_risk_greedy_pilot_parity.py --before pilot/before.csv --after pilot/results.csv
      - name: Preserve logs on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-risk-greedy-seed0-pilot
          path: pilot/
          if-no-files-found: warn
