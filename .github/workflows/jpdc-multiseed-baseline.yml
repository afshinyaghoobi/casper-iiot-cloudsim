name: JPDC Paired Multi-Seed Deadline Baseline Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-multiseed-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiseed:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build independent exploratory baseline while preserving frozen E4.6
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          grep -F 'scientific_retuning=false' e45_generation_manifest.txt
          python3 jpdc/pilot_deadline_baseline.py
          mvn -B -ntp -DskipTests compile
      - name: Run five scenarios for seed ${{ matrix.seed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jpdc_multiseed
          mvn -B -ntp -DskipTests exec:java \
            -Dexec.mainClass=org.casperiiot.e45.E45Campaign \
            -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_multiseed/seed_${{ matrix.seed }}.csv" \
            > jpdc_multiseed/seed_${{ matrix.seed }}.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=45" jpdc_multiseed/seed_${{ matrix.seed }}.log
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=next(Path('jpdc_multiseed').glob('*.csv'))
          rows=list(csv.DictReader(p.open()))
          assert len(rows)==45,len(rows)
          for scenario in sorted(set(r['scenario'] for r in rows)):
              d={r['policy']:r for r in rows if r['scenario']==scenario}
              assert {'DEADLINE_CAPACITY_PRESERVING','PRED_GREEDY','CASPER_FULL'}.issubset(d)
              print(scenario,'CASPER',d['CASPER_FULL']['late_dvr'],'NEW',d['DEADLINE_CAPACITY_PRESERVING']['late_dvr'],'GREEDY',d['PRED_GREEDY']['late_dvr'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-multiseed-seed-${{ matrix.seed }}
          path: jpdc_multiseed/
          if-no-files-found: warn
