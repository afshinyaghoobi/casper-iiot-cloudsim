name: JPDC Stage68 manuscript claims and evidence audit
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-stage68-manuscript-evidence.yml'
      - 'jpdc/STAGE68_JPDC_CLAIM_EVIDENCE_VALIDITY_MATRIX_2026-11-14.md'
      - 'jpdc/STAGE68_JPDC_MANUSCRIPT_VALIDITY_AND_NEGATIVE_RESULTS_DRAFT_2026-11-14.md'
      - 'jpdc/audit_stage68_manuscript_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript_source_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve frozen baseline and reject unsourced manuscript improvements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage68
          git rev-parse HEAD > stage68/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test "$(git hash-object jpdc/independent_physical_partial_live_stage64.py)" = 24d495dba4d29f8fe070ad6539b20361a7193cc6
          python3 -m py_compile jpdc/audit_stage68_manuscript_evidence.py
          python3 jpdc/audit_stage68_manuscript_evidence.py > stage68/evidence.log
          python3 jpdc/audit_stage68_manuscript_evidence.py > stage68/evidence_repeat.log
          cmp stage68/evidence.log stage68/evidence_repeat.log
          grep 'JPDC_STAGE68_MANUSCRIPT_EVIDENCE_NONCLAIMS_PASS' stage68/evidence.log
          echo JPDC_STAGE68_SOURCE_CLAIM_AUDIT_REPEAT_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage68-manuscript-claims-archived-evidence-audit
          path: stage68/
          if-no-files-found: warn
