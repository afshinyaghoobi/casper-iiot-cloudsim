name: SIMPAT v1.3 posthoc metric-claim and original-data integrity
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/simpat-v13-metric-claim-qa.yml'
      - 'jpdc/check_simpat_v13_claim_integrity.py'
      - 'jpdc/SIMPAT_MANUSCRIPT_V13_EXPLORATORY_METRIC_CHECK_2026-11-18.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm exact approved title, fixed primary data and qualified exploratory wording
        run: |
          set -euo pipefail
          python3 jpdc/check_simpat_v13_claim_integrity.py | tee simpat_v13_claim_audit.json
          python3 jpdc/audit_simpat_a2_matched_metric_discordance.py | tee simpat_v13_matched_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('simpat_v13_claim_audit.json'))
          b=json.load(open('simpat_v13_matched_audit.json'))
          assert a['status']=='PASS_STATIC_PACKET_CHECK' and a['title_locked'] and a['references_numbered']==12
          assert b['status']=='PASS_POSTHOC_DESCRIPTIVE_PAIR_AUDIT' and not b['causal_or_population_claim']
          assert a['unresolved_author_approvals'] and not a['publisher_submission']
          print('SIMPAT_V13_ORIGINAL_DATA_AND_POSTHOC_CLAIM_AUDIT_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpat-v13-posthoc-metric-claim-qa
          path: |
            simpat_v13_claim_audit.json
            simpat_v13_matched_audit.json
          if-no-files-found: warn
