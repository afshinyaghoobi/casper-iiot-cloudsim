name: JPDC Aggregate Network Severity 30 Seed
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-aggregate-network30.yml','jpdc/analyze_network30.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Download immutable E4.6 and 60 network-severity artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p jpdc_network_analysis/input
          curl -fLsS --retry 3 -o jpdc_network_analysis/e46-publication-results.zip https://github.com/afshinyaghoobi/casper-iiot-cloudsim/releases/download/v1.0.0-casper-iiot-e46/e46-publication-results.zip
          gh run download 40141610125 --repo ${{ github.repository }} --dir jpdc_network_analysis/input
      - name: Validate unaffected scenarios and compute paired effects
        run: python jpdc/analyze_network30.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-network30-statistics
          path: |
            jpdc_network_analysis/network30_results.csv
            jpdc_network_analysis/network30_results.json
          if-no-files-found: warn
