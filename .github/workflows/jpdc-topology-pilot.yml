name: JPDC Scaled Topology Generalization Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-topology-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        nodes: [14, 21, 28]
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate independent topology variant
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          grep -F 'scientific_retuning=false' e45_generation_manifest.txt
          python3 jpdc/topology_patch.py ${{ matrix.nodes }}
          mvn -B -ntp -DskipTests compile
      - name: Run frozen task and shock seeds on scaled infrastructure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jpdc_topology
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_topology/nodes${{ matrix.nodes }}_seed${{ matrix.seed }}.csv" > jpdc_topology/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=40" jpdc_topology/run.log
          python3 - <<'PY'
          import glob,csv
          p=glob.glob('jpdc_topology/*.csv'); assert len(p)==1
          with open(p[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==40
          for r in rows:
              if r['policy']=='CASPER_FULL':
                  print('TOPOLOGY_RESULT',r['scenario'],r['late_dvr'],r['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-${{ matrix.nodes }}-seed-${{ matrix.seed }}
          path: jpdc_topology/
          if-no-files-found: warn
