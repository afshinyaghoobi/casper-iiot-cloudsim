name: JPDC Stage66 retrospective paired task original holdout forensics
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-stage66-posthoc-task-forensics.yml'
      - 'jpdc/STAGE66_POSTHOC_PAIRED_TASK_FORENSICS_PREREG_2026-11-14.md'
      - 'jpdc/run_stage66_paired_task_forensics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retrospective_source:
    name: original-spent-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [1811,1815,1816,1818]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact spent Stage65 source artifact — never claim fresh holdout
        uses: actions/download-artifact@v4
        with:
          run-id: 43661658894
          github-token: ${{ github.token }}
          name: jpdc-stage65-frozen-holdout-seed-${{ matrix.seed }}
          path: original-stage65
      - name: Verify immutable method/source, original run provenance, retrospective protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage66
          git rev-parse HEAD > stage66/retrospective_code_sha.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test "$(git hash-object jpdc/independent_physical_partial_live_stage64.py)" = 24d495dba4d29f8fe070ad6539b20361a7193cc6
          test "$(git hash-object jpdc/partial_observation_selector_stage62.py)" = 338dd1de5c17028b3f60f1d635964b52e152df14
          test "$(git hash-object jpdc/causal_ambiguity_builder_stage60.py)" = 2bcb069b25964b2982e1f56de9725d2faa970762
          test "$(cat original-stage65/source_commit.txt)" = fd138174ac662b14a88421524f87b7dfa886c6fc
          cmp original-stage65/source.json original-stage65/repeat.json
          cmp original-stage65/source.log original-stage65/repeat.log
          test -s jpdc/STAGE66_POSTHOC_PAIRED_TASK_FORENSICS_PREREG_2026-11-14.md
          python3 -m py_compile jpdc/run_stage66_paired_task_forensics.py
      - name: Paired mission CPU-finish traces, original Stage65 exact source aggregate parity, repeat
        shell: bash
        run: |
          set -euo pipefail
          python3 jpdc/run_stage66_paired_task_forensics.py --seed ${{ matrix.seed }} --original-file original-stage65/source.json --out stage66/source.json > stage66/source.log 2> stage66/source.stderr
          python3 jpdc/run_stage66_paired_task_forensics.py --seed ${{ matrix.seed }} --original-file original-stage65/source.json --out stage66/repeat.json > stage66/repeat.log 2> stage66/repeat.stderr
          cmp stage66/source.json stage66/repeat.json
          cmp stage66/source.log stage66/repeat.log
          grep 'JPDC_STAGE66_ORIGINAL_TASK_FORENSIC_PARITY_PASS' stage66/source.log
          echo JPDC_STAGE66_RETROSPECTIVE_SOURCE_REPEAT_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage66-posthoc-task-forensics-${{ matrix.seed }}
          path: stage66/
          if-no-files-found: warn
