name: JPDC Queue Aware Weighted Completion Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-queue-weighted-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate score properties and build isolated policy
        run: |
          set -euo pipefail
          python3 jpdc/test_queue_weighted.py
          python3 tools/e45_generate.py
          python3 jpdc/queue_weighted_patch.py
          mvn -B -ntp -DskipTests compile
      - name: Paired seed scenario experiment
        run: |
          set -euo pipefail
          mkdir -p queue_weighted
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out queue_weighted/seed_${{ matrix.seed }}.csv" > queue_weighted/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=45" queue_weighted/run.log
          python3 - <<'PY'
          import glob,csv
          with open(glob.glob('queue_weighted/*.csv')[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==45
          assert len({(r['scenario'],r['policy']) for r in rows})==45
          for r in rows:
              if r['policy'] in ('CASPER_FULL','PRED_GREEDY','QUEUE_AWARE_WEIGHTED_COMPLETION'):
                  print('QUEUE_WEIGHT_RESULT',r['scenario'],r['policy'],r['late_dvr'],r['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-weighted-${{ matrix.seed }}
          path: queue_weighted/
          if-no-files-found: warn
