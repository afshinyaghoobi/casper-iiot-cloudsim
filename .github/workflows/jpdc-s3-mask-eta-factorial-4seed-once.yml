name: JPDC S3 mask eta factorial four seeds
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-mask-eta-factorial-4seed-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [40,41,42,43]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Paired LOW HIGH x adaptive fixed eta=1 interventions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p factorial
          git rev-parse HEAD > factorial/research_sha.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S3_MASK_ETA_FACTORIAL_PROTOCOL_2026-11-03.md
          case "${{ matrix.seed }}" in
            40) high=9,12,14,15,17,18 ;;
            41|42) high=12,14,15,16,17,20 ;;
            43) high=13,15,17,18,19,20 ;;
            *) echo "UNREGISTERED_SEED"; exit 1 ;;
          esac
          low=0,1,2,3,4,5
          printf "low=%s\nhigh=%s\n" "$low" "$high" > factorial/frozen_masks.txt
          for mask in low high; do
            nodes="${!mask}"
            for mode in adaptive clamped; do
              python3 tools/e45_generate.py
              python3 jpdc/patch_s3_mask_generated_e45.py --nodes "$nodes"
              if [ "$mode" = clamped ]; then python3 jpdc/eta_clamp_casper_full_patch.py; fi
              mvn -B -ntp -DskipTests compile
              mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out factorial/${mask}_${mode}.csv" > "factorial/${mask}_${mode}.log" 2>&1
              grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "factorial/${mask}_${mode}.log"
            done
          done
          python3 - <<'PY'
          import csv,json
          SEED=${{ matrix.seed }}
          results={}
          for mask in ('low','high'):
              modes={}
              for mode in ('adaptive','clamped'):
                  with open(f'factorial/{mask}_{mode}.csv',newline='') as f:
                      rr=list(csv.DictReader(f))
                  assert len(rr)==8,(mask,mode,len(rr))
                  policies={r['policy']:r for r in rr}
                  assert len(policies)==8
                  assert all(r['seed']==str(4202202600+SEED) and r['scenario']=='S3_HIDDEN_NETWORK_50LOSS' for r in rr)
                  modes[mode]=policies
              a,c=modes['adaptive'],modes['clamped']
              for policy in a:
                  if policy=='CASPER_FULL': continue
                  for col in a[policy]:
                      if col=='mean_mapper_us':continue
                      assert a[policy][col]==c[policy][col],('NONINTERVENTION_PARITY_FAIL',SEED,mask,policy,col)
              for col in c['CASPER_FULL']:
                  if col in ('policy','mean_mapper_us'):continue
                  assert c['CASPER_FULL'][col]==c['CASPER_HEALTH_STATIC'][col],('FULL_CLAMP_PARITY_FAIL',SEED,mask,col)
              results[mask]={}
              for mode in ('adaptive','clamped'):
                  r=modes[mode]['CASPER_FULL']
                  results[mask][mode]={metric:float(r[metric]) for metric in ('late_far','late_air','late_dvr','late_fwc','late_eta','post_far','post_air','post_dvr','post_fwc')}
          results['seed_index']=SEED
          results['interaction']={k:(results['high']['adaptive'][k]-results['high']['clamped'][k])-(results['low']['adaptive'][k]-results['low']['clamped'][k]) for k in ('late_far','late_air','late_dvr','late_fwc')}
          with open('factorial/paired_summary.json','w') as f:json.dump(results,f,indent=2)
          print('JPDC_MASK_ETA_FACTORIAL_PARITY_PASS',json.dumps(results))
          PY
      - name: Preserve complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-s3-mask-eta-seed-${{ matrix.seed }}
          path: factorial/
          if-no-files-found: warn
