name: JPDC Stage20 original CloudSimPlus microfixture timing accounting
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-stage20-native-timing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: jpdc-stage19-real-cloudsim-857-microqueue
          run-id: 42232972792
          github-token: ${{ github.token }}
          path: stage19-archived
      - name: Frozen science and exact Stage19 original artifact gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage20
          git rev-parse HEAD > stage20/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -s jpdc/STAGE20_NATIVE_TIMING_ACCOUNTING_PREREG_2026-11-06.md
          test -s stage19-archived/native.log
          python3 -m py_compile jpdc/audit_stage20_timing.py
          mvn -B -q -DskipTests compile
      - name: Run passive native timing callbacks and verify exact Stage19 parity
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q exec:java -Dexec.mainClass=org.casperiiot.jpdc.Stage20TimingAudit | grep -E '^STAGE20_|^JPDC_STAGE20_' > stage20/native.log
          python3 jpdc/audit_stage20_timing.py --original stage19-archived/native.log --current stage20/native.log --out stage20/forensic.json | tee stage20/audit.log
          mvn -B -q exec:java -Dexec.mainClass=org.casperiiot.jpdc.Stage20TimingAudit | grep -E '^STAGE20_|^JPDC_STAGE20_' > stage20/native_repeat.log
          cmp stage20/native.log stage20/native_repeat.log
          python3 jpdc/audit_stage20_timing.py --original stage19-archived/native.log --current stage20/native_repeat.log --out stage20/forensic_repeat.json > stage20/audit_repeat.log
          cmp stage20/forensic.json stage20/forensic_repeat.json
          echo JPDC_STAGE20_NATIVE_TIMING_BYTE_IDENTICAL_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage20-cloudsim-original-timing-forensic
          path: stage20/
          if-no-files-found: warn
