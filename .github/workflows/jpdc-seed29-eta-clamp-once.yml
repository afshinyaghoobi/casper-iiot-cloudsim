name: JPDC seed29 eta clamp intervention
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-seed29-eta-clamp-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run seed29 paired intervention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot_eta29
          git rev-parse HEAD > pilot_eta29/research_sha.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = "34256ca7bff46f911cf20e8b94278fbd09175746"
          python3 tools/e45_generate.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 29 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out pilot_eta29/before.csv" > pilot_eta29/before.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' pilot_eta29/before.log
          python3 jpdc/eta_clamp_casper_full_patch.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 29 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out pilot_eta29/after.csv" > pilot_eta29/after.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' pilot_eta29/after.log
          python3 - <<'PY'
          import csv
          from pathlib import Path
          b=list(csv.DictReader(open("pilot_eta29/before.csv")))
          a=list(csv.DictReader(open("pilot_eta29/after.csv")))
          assert len(a)==len(b)==8, (len(a),len(b))
          x={v["policy"]:v for v in b};y={v["policy"]:v for v in a}
          assert x.keys()==y.keys()
          for p in x:
              for c in x[p]:
                  if c=="mean_mapper_us" or (p=="CASPER_FULL"):continue
                  assert x[p][c]==y[p][c], (p,c,x[p][c],y[p][c])
          for c in y["CASPER_FULL"]:
              if c in ("policy","mean_mapper_us"):continue
              assert y["CASPER_FULL"][c]==y["CASPER_HEALTH_STATIC"][c], (c,y["CASPER_FULL"][c],y["CASPER_HEALTH_STATIC"][c])
          print("ETA29_INTERVENTION_PASS original_late_dvr=",x["CASPER_FULL"]["late_dvr"],
                "clamped_late_dvr=",y["CASPER_FULL"]["late_dvr"],
                "static_late_dvr=",y["CASPER_HEALTH_STATIC"]["late_dvr"])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpdc-seed29-eta-clamp
          path: pilot_eta29/
          if-no-files-found: warn
