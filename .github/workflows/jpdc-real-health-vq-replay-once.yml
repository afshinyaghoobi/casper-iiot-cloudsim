name: JPDC independent real health and virtual queue replay once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-real-health-vq-replay-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-vq:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Preserve frozen science and test generated-only health and queue event replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p health-vq
          git rev-parse HEAD > health-vq/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/REAL_HEALTH_VQ_EVENT_REPLAY_PROTOCOL_2026-11-04.md
          python3 -m py_compile jpdc/independent_casper_state.py jpdc/replay_real_health_vq_events.py
          for arm in control instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$arm" = instrumented ]; then
              python3 jpdc/instrument_real_health_vq_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out health-vq/$arm.csv" > "health-vq/$arm.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "health-vq/$arm.log"
          done
          python3 - <<'PY'
          import csv
          def load(path):
              with open(path,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          control=load('health-vq/control.csv')
          candidate=load('health-vq/instrumented.csv')
          assert control.keys()==candidate.keys()
          for p in control:
              for field in control[p]:
                  if field=='mean_mapper_us':continue
                  assert control[p][field]==candidate[p][field],(p,field,control[p][field],candidate[p][field])
          print('JPDC_REAL_HEALTH_VQ_SCIENTIFIC_NONINTERFERENCE_PASS')
          PY
          python3 jpdc/replay_real_health_vq_events.py --log health-vq/instrumented.log --out health-vq/independent_real_health_vq.json --tasks 30000 | tee health-vq/independent_replay_stdout.log
      - name: Save all raw evidence even if failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-real-health-vq-seed40-high
          path: health-vq/
          if-no-files-found: warn
