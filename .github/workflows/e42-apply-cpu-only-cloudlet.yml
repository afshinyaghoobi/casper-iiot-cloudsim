name: E4.2 Apply CPU-Only Cloudlet Semantics

on:
  push:
    paths:
      - 'scripts/e42_cpu_only_cloudlet_patch.py'
      - '.github/workflows/e42-apply-cpu-only-cloudlet.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compute-only Cloudlet semantics correction
        run: python3 scripts/e42_cpu_only_cloudlet_patch.py
      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/casperiiot/e42/E42Campaign.java
          git diff --cached --check
          git commit -m 'E4.2: isolate CloudSim CPU service from algebraic network model'
          git push
