name: JPDC Aggregate Topology 30 Seed Results
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-aggregate-topology30.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Retrieve frozen 21-node E4.6 and 60 topology artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p topology_analysis/input
          curl -fLsS --retry 3 -o topology_analysis/e46-publication-results.zip https://github.com/afshinyaghoobi/casper-iiot-cloudsim/releases/download/v1.0.0-casper-iiot-e46/e46-publication-results.zip
          gh run download 40148962449 --repo ${{ github.repository }} --dir topology_analysis/input
      - name: Validate all seeds and analyze paired topology results
        run: python3 jpdc/analyze_topology30.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-topology30-paired-statistics
          path: |
            topology_analysis/topology30_results.csv
            topology_analysis/topology30_results.json
          if-no-files-found: warn
