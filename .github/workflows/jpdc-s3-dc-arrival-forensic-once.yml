name: JPDC S3 datacenter arrival forensic once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-dc-arrival-forensic-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Frozen science and native DC-arrival instrumented comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p datacenter
          git rev-parse HEAD > datacenter/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S3_DATACENTER_ARRIVAL_FORENSIC_PROTOCOL_2026-11-04.md
          for mode in control instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$mode" = instrumented ]; then
              python3 jpdc/instrument_node14_event_order_generated_e45.py
              python3 jpdc/instrument_native_start_generated_e45.py
              python3 jpdc/instrument_dc_arrival_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out datacenter/$mode.csv" > "datacenter/$mode.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "datacenter/$mode.log"
          done
          python3 - <<'PY'
          import csv
          def read(name):
              with open(name,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          control=read('datacenter/control.csv')
          test=read('datacenter/instrumented.csv')
          assert control.keys()==test.keys()
          for policy in control:
              for key in control[policy]:
                  if key=='mean_mapper_us':continue
                  assert control[policy][key]==test[policy][key],(policy,key)
          print('JPDC_DATACENTER_FORENSIC_SCIENTIFIC_PARITY_PASS')
          PY
          python3 jpdc/audit_dc_arrival_forensic.py --log datacenter/instrumented.log --out datacenter/dc_arrival_audit.json | tee datacenter/audit_stdout.log
      - name: Upload original observations even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-s3-datacenter-arrival-seed40
          path: datacenter/
          if-no-files-found: warn
