name: JPDC Network-Shock Generalization Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-network-generalization.yml','jpdc/network_severity_patch.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        bw_retained_percent: [25, 50, 75]
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate frozen E4.5 then apply exploratory network severity
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          grep -F 'scientific_retuning=false' e45_generation_manifest.txt
          python3 jpdc/network_severity_patch.py ${{ matrix.bw_retained_percent }}
          mvn -B -ntp -DskipTests compile
      - name: Run seed and preserve results
        run: |
          set -euo pipefail
          mkdir -p jpdc_network
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_network/bw${{ matrix.bw_retained_percent }}_seed${{ matrix.seed }}.csv" > jpdc_network/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=40" jpdc_network/run.log
          python3 - <<'PY'
          import csv,glob
          files=glob.glob('jpdc_network/*.csv')
          assert len(files)==1
          with open(files[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==40
          for r in rows:
              if r['policy']=='CASPER_FULL' and r['scenario'].startswith(('S3_','S4_')):
                  print('NETWORK_RESULT',r['scenario'],r['late_dvr'],r['late_fwc'],r['late_eta'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-network-${{ matrix.bw_retained_percent }}-seed-${{ matrix.seed }}
          path: jpdc_network/
          if-no-files-found: warn
