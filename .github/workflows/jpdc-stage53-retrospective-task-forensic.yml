name: JPDC Stage53 retrospective task-ID forensic seed1107
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-stage53-retrospective-task-forensic.yml'
      - 'jpdc/run_stage53_retrospective_task_forensic.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover exact source seed1107 Stage52 original scientific result
        uses: actions/download-artifact@v4
        with:
          run-id: 43369034814
          github-token: ${{ github.token }}
          name: jpdc-stage52-holdout-seed-1107
          path: prior-seed1107
      - name: Frozen source and posthoc protocol integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage53
          git rev-parse HEAD > stage53/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test "$(git hash-object jpdc/queue_pressure_baseline_stage51.py)" = c0fdd686a451e528a68e7265cd8d3f2ac3bd9af9
          test "$(git hash-object jpdc/independent_physical_queue_baseline_stage51.py)" = 249f71030c791472dfdba6ebe38e91ff58b06d9a
          test -s jpdc/STAGE53_RETROSPECTIVE_SOURCE_TASK_CAUSALITY_PROTOCOL_2026-11-12.md
          test -s prior-seed1107/source.json
          python3 -m py_compile jpdc/run_stage53_retrospective_task_forensic.py
      - name: Native original source task-ID match retrospective only and deterministic double repeat
        shell: bash
        run: |
          set -euo pipefail
          python3 jpdc/run_stage53_retrospective_task_forensic.py --stage52-original-seed-file prior-seed1107/source.json --out stage53/audit.json > stage53/audit.log
          python3 jpdc/run_stage53_retrospective_task_forensic.py --stage52-original-seed-file prior-seed1107/source.json --out stage53/audit_repeat.json > stage53/audit_repeat.log
          cmp stage53/audit.json stage53/audit_repeat.json
          cmp stage53/audit.log stage53/audit_repeat.log
          grep JPDC_STAGE53_RETROSPECTIVE_SOURCE_RECONCILIATION_PASS stage53/audit.log
          echo JPDC_STAGE53_POSTHOC_TASK_MATCH_BYTE_IDENTICAL_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage53-retrospective-task1107
          path: stage53/
          if-no-files-found: warn
