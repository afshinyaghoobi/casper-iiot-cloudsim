name: E4.2 Apply CloudSim Precision Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/e42_cloudsim_precision_patch.py'
      - '.github/workflows/e42-apply-precision-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply CloudSim numerical-resolution correction
        run: python3 scripts/e42_cloudsim_precision_patch.py
      - name: Commit corrected source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/casperiiot/e42/E42Campaign.java
          git commit -m 'E4.2: set CloudSim event resolution to 0.1 ms'
          git push origin main
