name: JPDC deadline-feasible 5-scenario parity-gated pilot
on:
  workflow_dispatch:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - 'jpdc/deadline_feasible_min_uncertainty_patch.py'
      - 'jpdc/test_deadline_feasible_min_uncertainty.py'
      - 'jpdc/verify_deadline_feasible_pilot_parity.py'
      - '.github/workflows/jpdc-deadline-feasible-pilot.yml'
permissions:
  contents: read
jobs:
  seed0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate standalone deadline-aware policy semantics
        run: python3 jpdc/test_deadline_feasible_min_uncertainty.py
      - name: Generate and run original E45 policy set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot
          python3 tools/e45_generate.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 0 --cal 80000 --tasks 30000 --scenarios ALL --out pilot/before.csv" > pilot/before.log 2>&1
      - name: Apply isolated policy patch and run all scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 jpdc/deadline_feasible_min_uncertainty_patch.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 0 --cal 80000 --tasks 30000 --scenarios ALL --out pilot/after.csv" > pilot/after.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' pilot/after.log
          python3 jpdc/verify_deadline_feasible_pilot_parity.py --before pilot/before.csv --after pilot/after.csv
      - name: Upload outcomes and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-deadline-feasible-seed0
          path: pilot/
          if-no-files-found: warn
