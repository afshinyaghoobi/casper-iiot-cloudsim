name: JPDC original two Google2011 partitions independent byte audit
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-google2011-two-source-original-audit.yml'
      - 'jpdc/audit_google2011_two_original_sources_independent.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent_original_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact genuine original source artifact without new GCS calls
        uses: actions/download-artifact@v4
        with:
          run-id: 43763164420
          github-token: ${{ github.token }}
          name: jpdc-google2011-two-original-source-prefixes-overlap
          path: source-original
      - name: Guard frozen policies; independently parse actual GCS bytes and task IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p independent-original
          git rev-parse HEAD > independent-original/audit_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test "$(git hash-object jpdc/independent_physical_partial_live_stage64.py)" = 24d495dba4d29f8fe070ad6539b20361a7193cc6
          python3 -m py_compile jpdc/audit_google2011_two_original_sources_independent.py
          python3 jpdc/audit_google2011_two_original_sources_independent.py --original-dir source-original --out independent-original/audit.json | tee independent-original/audit.log
          python3 jpdc/audit_google2011_two_original_sources_independent.py --original-dir source-original --out independent-original/repeat.json > independent-original/repeat.log
          cmp independent-original/audit.json independent-original/repeat.json
          cmp independent-original/audit.log independent-original/repeat.log
          grep JPDC_TWO_SOURCE_ORIGINAL_IDENTITY_OVERLAP_VERIFIED_PASS independent-original/audit.log
          echo JPDC_TWO_SOURCE_GCS_INDEPENDENT_RAW_BYTE_AUDIT_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-google2011-two-source-original-bytes-independent-audit
          path: independent-original/
          if-no-files-found: warn
