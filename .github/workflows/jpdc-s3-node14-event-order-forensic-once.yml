name: JPDC S3 node14 event-order forensic once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-node14-event-order-forensic-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify frozen source and replay controlled forensic experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic
          git rev-parse HEAD > forensic/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S3_NODE14_EVENT_ORDER_FORENSIC_PROTOCOL_2026-11-04.md
          for mode in control forensic; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$mode" = forensic ]; then
              python3 jpdc/instrument_node14_event_order_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out forensic/$mode.csv" > "forensic/$mode.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "forensic/$mode.log"
          done
          python3 - <<'PY'
          import csv
          def read(name):
              with open(name,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          control=read('forensic/control.csv')
          observed=read('forensic/forensic.csv')
          assert control.keys()==observed.keys()
          for p in control:
              for k in control[p]:
                  if k=='mean_mapper_us':continue
                  assert control[p][k]==observed[p][k],(p,k,control[p][k],observed[p][k])
          print('JPDC_FORENSIC_NONINTERFERENCE_PASS')
          PY
          # The logger records derived service start (arrival + observed wait), not an inaccessible Cloudlet API field.
          python3 -m py_compile jpdc/audit_node14_event_order_forensic.py
          python3 jpdc/audit_node14_event_order_forensic.py --log forensic/forensic.log --out forensic/event_audit.json | tee forensic/event_audit.log
      - name: Retain data even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-s3-node14-event-order-forensic-seed40
          path: forensic/
          if-no-files-found: warn
