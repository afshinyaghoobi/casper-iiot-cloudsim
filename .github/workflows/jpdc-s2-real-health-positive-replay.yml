name: JPDC S2 real health positive event independent replay
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s2-real-health-positive-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-s2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Original S2 physical compute degradation and Python real-event health replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s2-health
          git rev-parse HEAD > s2-health/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S2_REAL_HEALTH_POSITIVE_EVENT_PREREG_2026-11-04.md
          python3 -m py_compile jpdc/independent_casper_state.py jpdc/instrument_real_health_vq_generated_e45.py jpdc/replay_real_health_vq_events.py
          for arm in control instrumented; do
            python3 tools/e45_generate.py
            if [ "$arm" = instrumented ]; then
              python3 jpdc/instrument_real_health_vq_generated_e45.py --scenario S2_HIDDEN_COMPUTE_40LOSS
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S2_HIDDEN_COMPUTE_40LOSS --out s2-health/$arm.csv" > "s2-health/$arm.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "s2-health/$arm.log"
          done
          python3 - <<'PY'
          import csv
          def load(path):
              with open(path,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          control=load('s2-health/control.csv')
          candidate=load('s2-health/instrumented.csv')
          assert control.keys()==candidate.keys()
          for p in control:
              for k in control[p]:
                  if k=='mean_mapper_us':continue
                  assert control[p][k]==candidate[p][k],(p,k,control[p][k],candidate[p][k])
          print('JPDC_S2_REAL_HEALTH_SCIENTIFIC_NONINTERFERENCE_PASS')
          PY
          python3 jpdc/replay_real_health_vq_events.py --log s2-health/instrumented.log --out s2-health/independent_health_result.json --tasks 30000 | tee s2-health/independent_audit_stdout.log
          python3 - <<'PY'
          import json
          d=json.load(open('s2-health/independent_health_result.json'))
          assert d['real_task_dispatches']==30000 and d['real_finish_health_updates']==30000
          assert d['max_backlog_error_ms']<=1e-8
          assert d['max_selected_queue_next_free_error_ms']<=1e-8
          if d['health_alarm_transitions']>0:
              print('JPDC_S2_REAL_POSITIVE_HEALTH_ALARM_COVERAGE_OBSERVED')
          else:
              print('JPDC_S2_REAL_NO_ALARM_OBSERVED_REPORT_LIMITATION')
          PY
      - name: Preserve all original observations even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-s2-real-health-seed40
          path: s2-health/
          if-no-files-found: warn
