name: JPDC Pilot Capacity Preserving Deadline Baseline
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-pilot-baseline.yml'
      - 'jpdc/pilot_deadline_baseline.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate frozen baseline and then apply separate exploratory patch
        run: |
          python3 tools/e45_generate.py
          python3 jpdc/pilot_deadline_baseline.py
          mvn -B -ntp -DskipTests compile
      - name: Run one-seed preliminary comparison
        run: |
          mkdir -p jpdc_pilot
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 0 --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_pilot/seed0.csv" > jpdc_pilot/run.log 2>&1
          grep -F 'E45_SEED_COMPLETE seed=0 rows=45' jpdc_pilot/run.log
          python3 - <<'PY'
          import csv
          from pathlib import Path
          data=list(csv.DictReader(Path('jpdc_pilot/seed0.csv').open()))
          assert len(data)==45,len(data)
          for scenario in sorted(set(x['scenario'] for x in data)):
              subset={x['policy']:x for x in data if x['scenario']==scenario}
              b=subset['DEADLINE_CAPACITY_PRESERVING']
              g=subset['PRED_GREEDY']
              c=subset['CASPER_FULL']
              print(scenario,'baseline_late_dvr',b['late_dvr'],'greedy',g['late_dvr'],'casper',c['late_dvr'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-one-seed-pilot
          path: jpdc_pilot/
