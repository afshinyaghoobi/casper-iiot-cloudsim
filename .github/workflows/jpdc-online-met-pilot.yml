name: JPDC Literature-Derived Online MET Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-online-met-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit checks and compile isolated literature-adapted rule
        shell: bash
        run: |
          set -euo pipefail
          python3 jpdc/test_online_met.py
          python3 tools/e45_generate.py
          python3 jpdc/online_met_patch.py
          mvn -B -ntp -DskipTests compile
      - name: Run five scenarios with online MET comparator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p online_met
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out online_met/seed_${{ matrix.seed }}.csv" > online_met/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=45" online_met/run.log
          python3 - <<'PY'
          import csv,glob
          with open(glob.glob('online_met/*.csv')[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==45
          assert len({(r['scenario'],r['policy']) for r in rows})==45
          for row in rows:
              if row['policy'] in ('CASPER_FULL','PRED_GREEDY','ONLINE_MET_ADAPTED'):
                  print('MET_RESULT',row['scenario'],row['policy'],row['late_dvr'],row['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-met-${{ matrix.seed }}
          path: online_met/
          if-no-files-found: warn
