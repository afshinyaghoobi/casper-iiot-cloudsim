name: E4.2 Apply Source Compatibility Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/e42_source_compat_patch.py'
      - '.github/workflows/e42-apply-source-compat.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply deterministic implementation-only correction
        run: python3 scripts/e42_source_compat_patch.py
      - name: Commit corrected source if changed
        run: |
          if git diff --quiet -- src/main/java/org/casperiiot/e42/E42Campaign.java; then
            echo 'No source change required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main/java/org/casperiiot/e42/E42Campaign.java
            git commit -m 'E4.2: apply CloudSim 8.5.7 API and provenance corrections'
            git push origin main
          fi
