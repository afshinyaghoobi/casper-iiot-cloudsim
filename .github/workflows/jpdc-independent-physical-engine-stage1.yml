name: JPDC independent physical queue Stage1
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-independent-physical-engine-stage1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Execute independently generated physical baseline experiments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p independent-engine
          git rev-parse HEAD > independent-engine/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/INDEPENDENT_DISCRETE_EVENT_ENGINE_STAGE1_PREREG_2026-11-04.md
          python3 -m py_compile jpdc/independent_physical_event_engine.py jpdc/test_independent_physical_event_engine.py jpdc/run_independent_engine_stage1.py
          python3 jpdc/test_independent_physical_event_engine.py | tee independent-engine/tests.log
          python3 jpdc/run_independent_engine_stage1.py --out independent-engine/matrix.json | tee independent-engine/matrix.log
          python3 - <<'PY'
          import json
          d=json.load(open('independent-engine/matrix.json'))
          assert d['status']=='PASS'
          assert len(d['rows'])==12 and d['total_task_policy_evaluations']==144000
          print('JPDC_INDEPENDENT_PHYSICAL_ENGINE_MATRIX_AUDIT_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-independent-physical-engine-stage1
          path: independent-engine/
          if-no-files-found: warn
