name: JPDC Stage21 exact CloudSimPlus 857 event-cadence source audit
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-stage21-source-timing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Immutable E42 and Stage21 prospective protocol
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage21
          git rev-parse HEAD > stage21/commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -s jpdc/STAGE21_CLOUDSIM_857_EVENT_CADENCE_SOURCE_PREREG_2026-11-06.md
          python3 -m py_compile jpdc/audit_stage21_cloudsim_timing_sources.py
      - name: Verify exact 8.5.7 archived source version from Maven
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q dependency:copy -Dartifact=org.cloudsimplus:cloudsimplus:8.5.7:jar:sources -DoutputDirectory=stage21 -Dmdep.stripVersion=false
          test -s stage21/cloudsimplus-8.5.7-sources.jar
          echo '8d3efcacfc661b2f1e018e279761fc4ae1e5584a770b2022d20930568688966c  stage21/cloudsimplus-8.5.7-sources.jar' | sha256sum --check
      - name: Search every original library source event update path twice
        shell: bash
        run: |
          set -euo pipefail
          python3 jpdc/audit_stage21_cloudsim_timing_sources.py --sources stage21/cloudsimplus-8.5.7-sources.jar --out stage21/source_scan.json | tee stage21/source_scan.log
          python3 jpdc/audit_stage21_cloudsim_timing_sources.py --sources stage21/cloudsimplus-8.5.7-sources.jar --out stage21/source_scan_repeat.json > stage21/repeat.log
          cmp stage21/source_scan.json stage21/source_scan_repeat.json
          echo JPDC_STAGE21_CLOUDSIM_SOURCE_BYTE_IDENTICAL_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage21-exact-cloudsim-857-event-cadence-source-scan
          path: |
            stage21/*.log
            stage21/*.json
            stage21/commit.txt
          if-no-files-found: warn
