name: E4.4 Online-Dispatch Parity

on:
  push:
    paths:
      - 'E44_LOCKED_PROTOCOL.json'
      - 'src/main/java/org/casperiiot/e44/**'
      - '.github/workflows/e44-online-dispatch-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The frozen-core verification compares against the locked E4.2
          # scientific SHA, so the runner must have that historical commit.
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify E4.4 lock and frozen scientific config
        run: |
          set -euo pipefail
          grep -F '"status": "LOCKED_BEFORE_IMPLEMENTATION"' E44_LOCKED_PROTOCOL.json
          grep -F '"source_scientific_sha": "ee1600b808a9747bc0373489e8ce531bd6bfb5e0"' E44_LOCKED_PROTOCOL.json
          test "$(git cat-file -t ee1600b808a9747bc0373489e8ce531bd6bfb5e0)" = commit
          git diff ee1600b808a9747bc0373489e8ce531bd6bfb5e0 -- src/main/java/org/casperiiot/e41/core/FrozenConfig.java src/main/java/org/casperiiot/e41/core/NodeHealthDetector.java src/main/java/org/casperiiot/e41/core/E17DualMemory.java | tee e44_frozen_core.diff
          test ! -s e44_frozen_core.diff
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
      - name: Run deterministic online-dispatch parity
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests exec:java \
            -Dexec.mainClass=org.casperiiot.e44.E44OnlineDispatchParity \
            2>&1 | tee e44_parity.log
          grep -F 'E44_ONLINE_DISPATCH_PARITY PASS' e44_parity.log
          test "$(grep -c '^E44_GATE PASS' e44_parity.log)" -eq 7
      - name: Record provenance
        run: |
          printf 'workflow_sha=%s\nsource_scientific_sha=%s\n' \
            "$GITHUB_SHA" 'ee1600b808a9747bc0373489e8ce531bd6bfb5e0' > E44_PROVENANCE.txt
      - name: Upload E4.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e44-online-dispatch-parity
          retention-days: 90
          if-no-files-found: error
          path: |
            E44_LOCKED_PROTOCOL.json
            E44_PROVENANCE.txt
            e44_frozen_core.diff
            e44_parity.log
