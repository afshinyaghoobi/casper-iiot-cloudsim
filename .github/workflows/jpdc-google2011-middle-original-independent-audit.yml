name: JPDC independent original Google2011 middle trace byte audit
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/jpdc-google2011-middle-original-independent-audit.yml'
      - 'jpdc/audit_google2011_middle_original_bytes.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent_archived_original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch EXACT original completed middle-partition source artifact without redownload
        uses: actions/download-artifact@v4
        with:
          run-id: 43733748151
          github-token: ${{ github.token }}
          name: jpdc-google2011-middle-250-original-temporal-prefix
          path: google2011-middle-original
      - name: Independently verify genuine gzip source, 13 fields, and paired event times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p middle-independent-audit
          git rev-parse HEAD > middle-independent-audit/audit_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test "$(git hash-object jpdc/independent_physical_partial_live_stage64.py)" = 24d495dba4d29f8fe070ad6539b20361a7193cc6
          python3 -m py_compile jpdc/audit_google2011_middle_original_bytes.py
          python3 jpdc/audit_google2011_middle_original_bytes.py --original-dir google2011-middle-original --out middle-independent-audit/audit.json | tee middle-independent-audit/audit.log
          python3 jpdc/audit_google2011_middle_original_bytes.py --original-dir google2011-middle-original --out middle-independent-audit/repeat.json > middle-independent-audit/repeat.log
          cmp middle-independent-audit/audit.json middle-independent-audit/repeat.json
          cmp middle-independent-audit/audit.log middle-independent-audit/repeat.log
          grep JPDC_GOOGLE2011_MIDDLE_ORIGINAL_BYTES_SECOND_PARSER_PASS middle-independent-audit/audit.log
          echo JPDC_GOOGLE2011_MIDDLE_SOURCE_PROVENANCE_SECOND_AUDIT_PASS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-google2011-middle-original-independent-128-events-audit
          path: middle-independent-audit/
          if-no-files-found: warn
