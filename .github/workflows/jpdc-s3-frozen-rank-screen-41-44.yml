name: JPDC frozen S3 rank utilization seeds 41 to 44
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-frozen-rank-screen-41-44.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-screen:
    strategy:
      fail-fast: false
      matrix:
        seed: [41,42,43,44]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unmodified source and frozen-seed rank activation profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ranks
          git rev-parse HEAD > ranks/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S3_RANK_UTILIZATION_FROZEN_SEEDS_41_44_PREREG_2026-11-04.md
          python3 -m py_compile jpdc/replay_casper_mission_decisions.py jpdc/screen_rank_utilization_unmodified.py
          python3 tools/e45_generate.py
          python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
          python3 jpdc/instrument_policy_decision_generated_e45.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out ranks/original.csv" > ranks/original.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' ranks/original.log
          python3 jpdc/screen_rank_utilization_unmodified.py --seed-index ${{ matrix.seed }} --log ranks/original.log --out ranks/rank_profile.json | tee ranks/rank_screen_stdout.log
          python3 - <<'PY'
          import csv,json
          r=json.load(open('ranks/rank_profile.json'))
          with open('ranks/original.csv',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==8 and len({row['policy'] for row in rows})==8
          for policy,stats in r['policies'].items():
              official=next(row for row in rows if row['policy']==policy)
              assert stats['mission_n']==int(official['mission_n']),(policy,'mission_n')
              assert stats['post_mission_n']==int(official['post_mission_n']),(policy,'post')
              assert sum(stats['ranks'].values())==stats['mission_n']
          print('JPDC_FROZEN_RANK_SCREEN_OFFICIAL_COHORT_PASS')
          PY
      - name: Retain all four seeds even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-frozen-rank-screen-seed-${{ matrix.seed }}
          path: ranks/
          if-no-files-found: warn
