name: JPDC S3 scheduler submission order forensic once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-scheduler-submission-forensic-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Two controlled E45 scientific simulations and VM scheduler trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scheduler
          git rev-parse HEAD > scheduler/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/S3_SCHEDULER_SUBMISSION_FORENSIC_PROTOCOL_2026-11-04.md
          for mode in control instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$mode" = instrumented ]; then
              python3 jpdc/instrument_node14_event_order_generated_e45.py
              python3 jpdc/instrument_native_start_generated_e45.py
              python3 jpdc/instrument_scheduler_submit_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out scheduler/$mode.csv" > "scheduler/$mode.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "scheduler/$mode.log"
          done
          python3 - <<'PY'
          import csv
          def load(file):
              with open(file,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          a=load('scheduler/control.csv');b=load('scheduler/instrumented.csv')
          assert a.keys()==b.keys()
          for p in a:
              for k in a[p]:
                  if k=='mean_mapper_us':continue
                  assert a[p][k]==b[p][k],(p,k,a[p][k],b[p][k])
          print('JPDC_SCHEDULER_SUBMISSION_SCIENTIFIC_PARITY_PASS')
          PY
          python3 -m py_compile jpdc/audit_scheduler_submit_forensic.py jpdc/instrument_scheduler_submit_generated_e45.py
          python3 jpdc/audit_scheduler_submit_forensic.py --log scheduler/instrumented.log --out scheduler/submission_analysis.json | tee scheduler/submission_audit.log
      - name: Keep raw evidence whether passed or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-s3-scheduler-submission-seed40
          path: scheduler/
          if-no-files-found: warn
