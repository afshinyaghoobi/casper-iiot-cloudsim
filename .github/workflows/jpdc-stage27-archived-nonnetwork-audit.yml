name: JPDC Stage27 original immutable CPU WAIT residual forensic
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-stage27-archived-nonnetwork-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jpdc-stage27-cpu-nonnetwork-source-development-seed90
          run-id: 42269844289
          github-token: ${{ github.token }}
          path: original-stage27
      - name: Verify original Git source and all 48k immutable CPU WAIT residual labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage27-archive
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -s original-stage27/full_trace.json
          python3 jpdc/audit_stage27_immutable_nonnetwork.py --original original-stage27/full_trace.json --out stage27-archive/forensic.json | tee stage27-archive/forensic.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-stage27-original-artifact-complete-nonnetwork-forensic
          path: stage27-archive/
          if-no-files-found: warn
