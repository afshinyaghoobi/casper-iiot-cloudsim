name: JPDC Online Minimum Feasible Slack Baseline Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-online-slack-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate isolated comparison build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          python3 jpdc/online_min_slack_patch.py
          mvn -B -ntp -DskipTests compile
      - name: Execute five scenarios with nine policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jpdc_online_slack
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_online_slack/seed_${{ matrix.seed }}.csv" > jpdc_online_slack/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=45" jpdc_online_slack/run.log
          python3 - <<'PY'
          import csv,glob
          with open(glob.glob('jpdc_online_slack/*.csv')[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==45
          assert len(set((r['scenario'],r['policy']) for r in rows))==45
          for r in rows:
              if r['policy'] in ('CASPER_FULL','PRED_GREEDY','ONLINE_MIN_FEASIBLE_SLACK'):
                  print('ONLINE_SLACK_RESULT',r['scenario'],r['policy'],r['late_dvr'],r['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-slack-seed-${{ matrix.seed }}
          path: jpdc_online_slack/
          if-no-files-found: warn
