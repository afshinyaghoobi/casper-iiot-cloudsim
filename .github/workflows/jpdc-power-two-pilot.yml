name: JPDC Power-of-Two Network Queue Aware Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-power-two-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate independent power of two variant
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          python3 jpdc/power_two_patch.py
          mvn -B -ntp -DskipTests compile
      - name: Run matching seed scenarios
        run: |
          set -euo pipefail
          mkdir -p jpdc_p2c
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_p2c/seed_${{ matrix.seed }}.csv" > jpdc_p2c/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=45" jpdc_p2c/run.log
          python3 - <<'PY'
          import glob,csv
          with open(glob.glob('jpdc_p2c/*.csv')[0]) as f: rows=list(csv.DictReader(f))
          assert len(rows)==45
          for row in rows:
              if row['policy'] in ('CASPER_FULL','PRED_GREEDY','POWER_OF_TWO_PREDICTED'):
                  print('P2C_RESULT',row['scenario'],row['policy'],row['late_dvr'],row['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-two-pilot-${{ matrix.seed }}
          path: jpdc_p2c/
