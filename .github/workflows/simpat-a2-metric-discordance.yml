name: SIMPAT exploratory A2 paired metric-discordance reproducibility
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/simpat-a2-metric-discordance.yml'
      - 'jpdc/audit_simpat_a2_matched_metric_discordance.py'
      - 'jpdc/manuscript_a2_primary_24_cases_2026-11-18.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static_matched_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute all matched comparisons from independently source-checked A2 CSV
        run: |
          set -euo pipefail
          python3 jpdc/audit_simpat_a2_matched_metric_discordance.py | tee simpat_a2_metric_discordance.json
          python3 - <<'PY'
          import json
          a=json.load(open('simpat_a2_metric_discordance.json'))
          assert a['status']=='PASS_POSTHOC_DESCRIPTIVE_PAIR_AUDIT'
          assert a['analysis_type']=='EXPLORATORY_POSTHOC_DESCRIPTIVE'
          assert not a['causal_or_population_claim'] and not a['new_native_simulation']
          assert a['n_pe_matched_pairs']==12 and a['n_event_gap_matched_pairs']==12
          print('SIMPAT_A2_MATCHED_DISCORDANCE_PASS_NONCAUSAL')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpat-a2-posthoc-matched-discordance
          path: simpat_a2_metric_discordance.json
          if-no-files-found: warn
