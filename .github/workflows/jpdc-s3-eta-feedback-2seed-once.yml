name: JPDC S3 eta feedback mechanism seeds 7 and 18
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-s3-eta-feedback-2seed-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generate and instrument E45, execute, validate feedback contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feedback
          git rev-parse HEAD > feedback/research_sha.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = "34256ca7bff46f911cf20e8b94278fbd09175746"
          python3 tools/e45_generate.py
          python3 jpdc/instrument_eta_feedback_generated_e45.py
          mvn -B -ntp -DskipTests compile
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out feedback/results.csv" > feedback/run.log 2>&1
          grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' feedback/run.log
          grep '^JPDC_ETA_FEEDBACK,' feedback/run.log > feedback/eta_feedback.csv
          python3 - <<'PY'
          import csv,math
          feedback=list(csv.reader(open('feedback/eta_feedback.csv')))
          assert len(feedback)>1000,len(feedback)
          ids=set()
          for row in feedback:
              assert len(row)==14 and row[0]=='JPDC_ETA_FEEDBACK',row
              seed,scenario,policy,idx=row[1:5]
              assert seed=='4202202600'+str(${{ matrix.seed }}) and scenario=='S3_HIDDEN_NETWORK_50LOSS' and policy=='CASPER_FULL'
              assert idx not in ids;ids.add(idx)
              score,reference,atdispatch,before,after=map(float,row[5:10])
              assert all(map(math.isfinite,(score,reference,atdispatch,before,after)))
              assert score>=0 and reference>0 and 1<=atdispatch<=3 and 1<=before<=3 and 1<=after<=3
              assert row[10] in ('true','false') and row[11] in ('true','false')
              age0,age1=map(int,row[12:14])
              assert age1>=age0 and age1-age0<=1
          assert len(list(csv.DictReader(open('feedback/results.csv'))))==8
          print('JPDC_FEEDBACK_TRACE_CONTRACT_PASS',len(feedback))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jpdc-s3-eta-feedback-seed-${{ matrix.seed }}
          path: feedback/
          if-no-files-found: warn
