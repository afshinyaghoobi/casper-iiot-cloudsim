name: JPDC Compute-Normalized Topology Pilot
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-normalized-topology-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        nodes: [14, 28]
        seed: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Construct independent scaled and compute-normalized variant
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/e45_generate.py
          python3 jpdc/topology_patch.py ${{ matrix.nodes }}
          python3 jpdc/normalize_compute_topology.py ${{ matrix.nodes }}
          mvn -B -ntp -DskipTests compile
      - name: Evaluate matched task seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jpdc_normalized
          mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed ${{ matrix.seed }} --cal 80000 --tasks 30000 --scenarios S0_STATIONARY,S1_LAMBDA_X2,S2_HIDDEN_COMPUTE_40LOSS,S3_HIDDEN_NETWORK_50LOSS,S4_COMPOUND --out jpdc_normalized/norm${{ matrix.nodes }}_seed${{ matrix.seed }}.csv" > jpdc_normalized/run.log 2>&1
          grep -F "E45_SEED_COMPLETE seed=${{ matrix.seed }} rows=40" jpdc_normalized/run.log
          python3 - <<'PY'
          import csv,glob
          with open(glob.glob('jpdc_normalized/*.csv')[0]) as f: data=list(csv.DictReader(f))
          assert len(data)==40
          for row in data:
              if row['policy']=='CASPER_FULL':
                  print('NORMALIZED_RESULT',row['scenario'],row['late_dvr'],row['late_fwc'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-${{ matrix.nodes }}-${{ matrix.seed }}
          path: jpdc_normalized/
          if-no-files-found: warn
