name: JPDC Aggregate Compute Normalized 30 Seeds
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: [.github/workflows/jpdc-normalized30-aggregate.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Download immutable E4.6 and finished normalized topology results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p normalized_analysis/input
          curl -fLsS --retry 3 -o normalized_analysis/e46-publication-results.zip https://github.com/afshinyaghoobi/casper-iiot-cloudsim/releases/download/v1.0.0-casper-iiot-e46/e46-publication-results.zip
          gh run download 40158003736 --repo ${{ github.repository }} --dir normalized_analysis/input
      - name: Validate all thirty seeds and compute Holm adjusted paired results
        run: python3 jpdc/analyze_normalized30.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-normalized30-statistics
          path: |
            normalized_analysis/normalized30_results.csv
            normalized_analysis/normalized30_results.json
          if-no-files-found: warn
