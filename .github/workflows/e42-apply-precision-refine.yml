name: E4.2 Apply Precision Refinement

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/e42_precision_refine_patch.py'
      - '.github/workflows/e42-apply-precision-refine.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine CloudSim event resolution for numerical parity
        run: python3 scripts/e42_precision_refine_patch.py
      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/casperiiot/e42/E42Campaign.java
          git commit -m 'E4.2: refine CloudSim event resolution to 0.001 ms'
          git push origin main
