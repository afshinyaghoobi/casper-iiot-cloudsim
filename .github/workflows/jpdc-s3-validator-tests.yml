name: JPDC S3 validator contract tests
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - 'jpdc/test_validate_s3_strata30.py'
      - 'jpdc/validate_s3_strata30.py'
      - '.github/workflows/jpdc-s3-validator-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validator-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise valid and invalid synthetic 30-seed fixtures
        run: python3 jpdc/test_validate_s3_strata30.py
