name: JPDC E17 real CloudSim event independent replay once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-e17-real-event-independent-replay-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e17:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compare frozen CloudSim with generated-only observed E17 event logger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e17
          git rev-parse HEAD > e17/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/E17_REAL_EVENT_INDEPENDENT_REPLAY_PROTOCOL_2026-11-04.md
          python3 -m py_compile jpdc/independent_casper_state.py jpdc/replay_e17_real_cloudsim_events.py
          for arm in control instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$arm" = instrumented ]; then
              python3 jpdc/instrument_e17_real_event_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out e17/$arm.csv" > "e17/$arm.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "e17/$arm.log"
          done
          python3 - <<'PY'
          import csv
          def read(path):
              with open(path,newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          before=read('e17/control.csv');after=read('e17/instrumented.csv')
          assert before.keys()==after.keys()
          for p in before:
              for field in before[p]:
                  if field=='mean_mapper_us':continue
                  assert before[p][field]==after[p][field],(p,field,before[p][field],after[p][field])
          print('JPDC_E17_REAL_EVENT_SCIENTIFIC_NONINTERFERENCE_PASS')
          PY
          python3 jpdc/replay_e17_real_cloudsim_events.py --log e17/instrumented.log --results e17/instrumented.csv --tasks 30000 --out e17/independent_feedback_audit.json | tee e17/independent_feedback_audit_stdout.log
      - name: Save source evidence even if failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-e17-real-event-seed40-high
          path: e17/
          if-no-files-found: warn
