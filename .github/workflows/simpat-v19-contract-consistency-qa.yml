name: SIMPAT v1.9 contract vs experiment consistency audit
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths:
      - '.github/workflows/simpat-v19-contract-consistency-qa.yml'
      - 'jpdc/check_simpat_v19_contract_consistency.py'
      - 'jpdc/SIMPAT_MANUSCRIPT_V19_SOFTWARE_CONTRACT_AND_LIMITATIONS_2026-11-18.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_claim_consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact user title, 12 references, unchanged A2 source results and versioned scheduler API caveats
        run: |
          set -euo pipefail
          python3 jpdc/check_simpat_v19_contract_consistency.py | tee simpat_v19_contract_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('simpat_v19_contract_audit.json'))
          assert a['status']=='PASS_STATIC_PACKET_CHECK'
          assert a['title_locked'] and a['references_numbered']==12
          assert a['source_cases']==24 and a['unresolved_author_approvals']
          assert not a['publisher_submission']
          print('SIMPAT_V19_SOFTWARE_CONTRACT_AND_METHODOLOGY_CONSISTENCY_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpat-v19-contract-consistency
          path: simpat_v19_contract_audit.json
          if-no-files-found: warn
