name: JPDC real calibration outcome independent conformal qhat once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-real-calibration-quantiles-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Frozen science and actual CloudSim calibration input-based Python quantiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realcal
          git rev-parse HEAD > realcal/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/REAL_CALIBRATION_SCORES_INDEPENDENT_QHAT_PREREG_2026-11-04.md
          python3 -m py_compile jpdc/independent_workload_generator.py jpdc/replay_real_calibration_quantiles.py jpdc/instrument_real_calibration_scores_generated_e45.py
          for arm in control instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$arm" = instrumented ]; then
              python3 jpdc/instrument_real_calibration_scores_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out realcal/$arm.csv" > "realcal/$arm.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "realcal/$arm.log"
          done
          python3 - <<'PY'
          import csv
          def load(path):
              with open(path,newline='') as f:rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          a=load('realcal/control.csv');b=load('realcal/instrumented.csv')
          assert a.keys()==b.keys()
          for p in a:
              for k in a[p]:
                  if k=='mean_mapper_us':continue
                  assert a[p][k]==b[p][k],(p,k,a[p][k],b[p][k])
          print('JPDC_REAL_CALIBRATION_SCIENTIFIC_PARITY_PASS')
          PY
          python3 jpdc/replay_real_calibration_quantiles.py --log realcal/instrumented.log --out realcal/independent_real_quantiles.json | tee realcal/calibration_audit_stdout.log
          PYTHONPATH=jpdc python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from replay_real_calibration_quantiles import audit
          raw=Path('realcal/instrumented.log').read_text()
          replaced=raw.replace('JPDC_CAL_REAL_MISSION,','JPDC_CAL_REAL_MISSION,0,',1)
          assert raw!=replaced
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'bad.log';p.write_text(replaced)
              try:audit(p)
              except ValueError:print('JPDC_REAL_CALIBRATION_CORRUPTION_REJECTED_PASS')
              else:raise AssertionError('corrupt original calibration record was accepted')
          PY
      - name: Keep real calibration and scientific data even if fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-original-real-calibration-seed40
          path: realcal/
          if-no-files-found: warn
