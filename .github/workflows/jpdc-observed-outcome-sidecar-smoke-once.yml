name: JPDC observed outcome sidecar smoke once
on:
  push:
    branches: [jpdc-seed0-repro-20261024]
    paths: ['.github/workflows/jpdc-observed-outcome-sidecar-smoke-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify unchanged frozen science and launch paired runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sidecar
          git rev-parse HEAD > sidecar/source_commit.txt
          test "$(git hash-object src/main/java/org/casperiiot/e42/E42Campaign.java)" = 34256ca7bff46f911cf20e8b94278fbd09175746
          test -f jpdc/OBSERVED_OUTCOME_SIDECAR_PROTOCOL_2026-11-03.md
          for mode in baseline instrumented; do
            python3 tools/e45_generate.py
            python3 jpdc/patch_s3_mask_generated_e45.py --nodes 9,12,14,15,17,18
            if [ "$mode" = instrumented ]; then
              python3 jpdc/instrument_observed_outcome_generated_e45.py
            fi
            mvn -B -ntp -DskipTests compile
            mvn -B -ntp -DskipTests exec:java -Dexec.mainClass=org.casperiiot.e45.E45Campaign -Dexec.args="--seed 40 --cal 80000 --tasks 30000 --scenarios S3_HIDDEN_NETWORK_50LOSS --out sidecar/$mode.csv" > "sidecar/$mode.log" 2>&1
            grep -q 'E45_ONLINE_DISPATCH_RUNTIME PASS' "sidecar/$mode.log"
          done
          python3 - <<'PY'
          import csv
          def load(p):
              with open(p,newline='') as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==8 and len({r['policy'] for r in rows})==8
              return {r['policy']:r for r in rows}
          a=load('sidecar/baseline.csv')
          b=load('sidecar/instrumented.csv')
          assert a.keys()==b.keys()
          for policy in a:
              for k in a[policy]:
                  if k=='mean_mapper_us':continue
                  assert a[policy][k]==b[policy][k],(policy,k,a[policy][k],b[policy][k])
          print('JPDC_SIDECAR_NONINTERFERENCE_PASS')
          PY
          python3 jpdc/audit_observed_outcome_sidecar.py --log sidecar/instrumented.log --results sidecar/instrumented.csv --tasks 30000 | tee sidecar/audit.log
      - name: Preserve evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpdc-observed-outcome-seed40-high
          path: sidecar/
          if-no-files-found: warn
